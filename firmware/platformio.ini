; LoRaHub node kit. Every [env:...] below is a ready node: a board plus a node
; type. Build and flash one from this folder:
;
;   pio run -e heltec_v3_relay -t upload      then   pio device monitor
;
; For a node of your own, copy nodes/example-greenhouse.ini, rename the env and
; change the values (NODE_ID, sensors, interval...). Every setting, with its
; default, is in include/node_config.h; docs/configuration.md explains them.

[platformio]
default_envs = heltec_v3_sensor_bme280
extra_configs = nodes/*.ini

[kit]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@7.1.2
build_flags = -Wall

; ---------- boards ----------
[board_heltec_v3]
board = heltec_wifi_lora_32_V3
build_flags = -D BOARD_HELTEC_V3

[board_ttgo_lora32]
board = ttgo-lora32-v21
build_flags = -D BOARD_TTGO_LORA32_V21

[board_esp32_rfm95]
board = esp32dev
build_flags = -D BOARD_ESP32_RFM95

; ---------- node types ----------
[type_sensor_ds18b20]
build_flags = -D NODE_TYPE=NODE_SENSOR -D SENSOR_DS18B20=1
lib_deps = paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0

[type_sensor_bme280]
build_flags = -D NODE_TYPE=NODE_SENSOR -D SENSOR_BME280=1
lib_deps = adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit Unified Sensor@1.1.14

[type_relay]
build_flags = -D NODE_TYPE=NODE_RELAY
lib_deps =

[type_button]
build_flags = -D NODE_TYPE=NODE_BUTTON
lib_deps =

[type_counter]
build_flags = -D NODE_TYPE=NODE_COUNTER
lib_deps =

; ---------- Heltec WiFi LoRa 32 V3 ----------
[env:heltec_v3_sensor_ds18b20]
extends = kit
board = ${board_heltec_v3.board}
build_flags = ${kit.build_flags} ${board_heltec_v3.build_flags} ${type_sensor_ds18b20.build_flags}
lib_deps =
  ${kit.lib_deps}
  ${type_sensor_ds18b20.lib_deps}

[env:heltec_v3_sensor_bme280]
extends = kit
board = ${board_heltec_v3.board}
build_flags = ${kit.build_flags} ${board_heltec_v3.build_flags} ${type_sensor_bme280.build_flags}
lib_deps =
  ${kit.lib_deps}
  ${type_sensor_bme280.lib_deps}

[env:heltec_v3_relay]
extends = kit
board = ${board_heltec_v3.board}
build_flags = ${kit.build_flags} ${board_heltec_v3.build_flags} ${type_relay.build_flags}

[env:heltec_v3_button]
extends = kit
board = ${board_heltec_v3.board}
build_flags = ${kit.build_flags} ${board_heltec_v3.build_flags} ${type_button.build_flags}

[env:heltec_v3_counter]
extends = kit
board = ${board_heltec_v3.board}
build_flags = ${kit.build_flags} ${board_heltec_v3.build_flags} ${type_counter.build_flags}

; ---------- LilyGO TTGO LoRa32 V2.1 ----------
[env:ttgo_lora32_sensor_ds18b20]
extends = kit
board = ${board_ttgo_lora32.board}
build_flags = ${kit.build_flags} ${board_ttgo_lora32.build_flags} ${type_sensor_ds18b20.build_flags}
lib_deps =
  ${kit.lib_deps}
  ${type_sensor_ds18b20.lib_deps}

[env:ttgo_lora32_sensor_bme280]
extends = kit
board = ${board_ttgo_lora32.board}
build_flags = ${kit.build_flags} ${board_ttgo_lora32.build_flags} ${type_sensor_bme280.build_flags}
lib_deps =
  ${kit.lib_deps}
  ${type_sensor_bme280.lib_deps}

[env:ttgo_lora32_relay]
extends = kit
board = ${board_ttgo_lora32.board}
build_flags = ${kit.build_flags} ${board_ttgo_lora32.build_flags} ${type_relay.build_flags} -D BUTTON_PIN=-1

[env:ttgo_lora32_button]
extends = kit
board = ${board_ttgo_lora32.board}
build_flags = ${kit.build_flags} ${board_ttgo_lora32.build_flags} ${type_button.build_flags} -D BUTTON_PIN=0

[env:ttgo_lora32_counter]
extends = kit
board = ${board_ttgo_lora32.board}
build_flags = ${kit.build_flags} ${board_ttgo_lora32.build_flags} ${type_counter.build_flags} -D PULSE_PIN=0

; ---------- any ESP32 with an RFM95 / SX1276 ----------
[env:esp32_rfm95_sensor_ds18b20]
extends = kit
board = ${board_esp32_rfm95.board}
build_flags = ${kit.build_flags} ${board_esp32_rfm95.build_flags} ${type_sensor_ds18b20.build_flags}
lib_deps =
  ${kit.lib_deps}
  ${type_sensor_ds18b20.lib_deps}

[env:esp32_rfm95_sensor_bme280]
extends = kit
board = ${board_esp32_rfm95.board}
build_flags = ${kit.build_flags} ${board_esp32_rfm95.build_flags} ${type_sensor_bme280.build_flags}
lib_deps =
  ${kit.lib_deps}
  ${type_sensor_bme280.lib_deps}

[env:esp32_rfm95_relay]
extends = kit
board = ${board_esp32_rfm95.board}
build_flags = ${kit.build_flags} ${board_esp32_rfm95.build_flags} ${type_relay.build_flags}

[env:esp32_rfm95_button]
extends = kit
board = ${board_esp32_rfm95.board}
build_flags = ${kit.build_flags} ${board_esp32_rfm95.build_flags} ${type_button.build_flags}

[env:esp32_rfm95_counter]
extends = kit
board = ${board_esp32_rfm95.board}
build_flags = ${kit.build_flags} ${board_esp32_rfm95.build_flags} ${type_counter.build_flags}
