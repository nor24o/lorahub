; A board that is not in the list: an ESP32-C3 SuperMini with an SX1262 module
; (for example an Ebyte E22-900M), as a relay. Give the radio chip and every
; pin. Then:  pio run -e porch_light -t upload

[env:porch_light]
extends = kit
board = esp32-c3-devkitm-1
build_flags = ${kit.build_flags} -D BOARD_CUSTOM ${type_relay.build_flags}
  -D NODE_ID=0xA201
  -D RADIO_SX1262=1
  -D LORA_SCK=4 -D LORA_MISO=5 -D LORA_MOSI=6 -D LORA_NSS=7
  -D LORA_RST=3 -D LORA_IRQ=2 -D LORA_BUSY=1
  ; E22 modules have a 1.8 V TCXO and switch the antenna with DIO2
  -D TCXO_VOLTAGE=1.8 -D DIO2_RF_SWITCH=1
  -D RELAY_PIN=10 -D LED_PIN=8 -D BUTTON_PIN=9
