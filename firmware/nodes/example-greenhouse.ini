; A node of your own. Copy this file (any name ending in .ini), rename the env
; and change what you need; everything not set here keeps its default from
; include/node_config.h. Then:  pio run -e greenhouse -t upload
;
; Start from one of the ready envs in platformio.ini (board + type) and add
; your settings after its build_flags.

[env:greenhouse]
extends = env:heltec_v3_sensor_bme280
build_flags = ${env:heltec_v3_sensor_bme280.build_flags}
  ; who it is: group A101 in LoRaHub; the serial comes from the chip unless set here
  -D NODE_ID=0xA101
  ; how often it reports (the Interval command changes it later)
  -D REPORT_INTERVAL_S=600
  ; a farther greenhouse: slower and longer range
  -D UPLINK_SF=10
  ; spread the reports over the gateways' 8 channels
  -D UPLINK_HOP=1
